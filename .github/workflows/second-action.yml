name: Second workflow
on: push
jobs:

  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: python version
        run: python3 -v
      - name: Install python package
        run: python3 -m pip install -r requirements.txt
      - name: Run app
        run: python3 main.py