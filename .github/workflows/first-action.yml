name: First workflow
on: workflow_dispatch
jobs:
  first-job: 
    runs-on: ubuntu-latest
    steps:
      - name: Print greeting
        run: echo "Hello world"
      - name: Print goodbye
        run: pwd

  second-job:
    runs-on: ubuntu-latest
    steps:
      - name: List files
        run: ls -a
      - name: Install python package
        run: python3 -m pip install -r requirements.txt
      - name: Run app
        run: python3 main.py